name: CI

on:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Basic secret scan
        run: |
          python - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          patterns = {
              "aws_access_key": re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              "github_pat": re.compile(r"\bgithub_pat_[A-Za-z0-9_]{82}\b"),
              "github_token": re.compile(r"\bgh[pousr]_[A-Za-z0-9]{36,255}\b"),
              "google_api_key": re.compile(r"\bAIza[0-9A-Za-z\-_]{35}\b"),
              "private_key": re.compile(r"-----BEGIN (?:RSA|DSA|EC|OPENSSH|PGP) PRIVATE KEY-----"),
              "slack_token": re.compile(r"\bxox[baprs]-[A-Za-z0-9-]{10,}\b"),
          }

          tracked = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              capture_output=True,
          ).stdout.split(b"\0")

          findings = []
          for entry in tracked:
              if not entry:
                  continue
              path = pathlib.Path(entry.decode())
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for line_no, line in enumerate(text.splitlines(), start=1):
                  for name, pattern in patterns.items():
                      if pattern.search(line):
                          findings.append(f"{path}:{line_no}: {name}")

          if findings:
              print("Potential secrets detected:")
              print("\n".join(findings))
              sys.exit(1)

          print("Basic secret scan passed.")
          PY

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run backend test scripts
        run: |
          while IFS= read -r file; do
            echo "::group::${file}"
            python "${file}"
            echo "::endgroup::"
          done < <(find tests -maxdepth 1 -name 'test_*.py' | sort)

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci
      - name: Run TypeScript check
        run: npx tsc --noEmit

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm run test -- --run

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
